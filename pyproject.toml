[project]
name = "trend-finder-bot"
version = "0.1.0"
description = "Telegram bot for country-based search and community trends"
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.20,<4",
    "aiohttp>=3.11,<4",
    "aiosqlite>=0.21,<1",
    "arq>=0.26,<1",
    "asyncpg>=0.30,<1",
    "feedparser>=6.0,<7",
    "loguru>=0.7,<1",
    "pydantic-settings>=2.8,<3",
    "redis>=5.2,<6",
    "sqlalchemy[asyncio]>=2.0,<3",
    "tenacity>=9,<10",
]

[dependency-groups]
dev = [
    "black>=25,<26",
    "mypy>=1.15,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["feedparser"]
ignore_missing_imports = true
