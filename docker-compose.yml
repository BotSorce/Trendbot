services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  bot:
    build: .
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      TREND_FINDER_DATABASE_URL: ${TREND_FINDER_DATABASE_URL:-sqlite+aiosqlite:///./data/trend_finder.db}
    volumes:
      - bot_data:/app/data
      - bot_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["uv", "run", "--no-sync", "arq", "trend_finder.worker.WorkerSettings"]
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0
      TREND_FINDER_DATABASE_URL: ${TREND_FINDER_DATABASE_URL:-sqlite+aiosqlite:///./data/trend_finder.db}
    volumes:
      - bot_data:/app/data
      - bot_logs:/app/logs
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    profiles: ["postgres"]
    environment:
      POSTGRES_DB: trend_finder
      POSTGRES_USER: trend_finder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trend_finder -d trend_finder"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis_data:
  bot_data:
  bot_logs:
  postgres_data:
